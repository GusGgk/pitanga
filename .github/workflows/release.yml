# Builds Pitanga on every push/PR, and publishes a GitHub Release when a tag like v1.0.0 is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build exe, installer, portable zip
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Build MSIX (only when Store identity is configured)
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        run: >
          ./packaging/msix/build-msix.ps1
          -Version "${{ steps.version.outputs.value }}"
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}"
          -Publisher "${{ vars.MSIX_PUBLISHER }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - uses: actions/upload-artifact@v7
        with:
          name: pitanga-${{ steps.version.outputs.value }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.msix
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          name: Pitanga ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/Pitanga-Setup-*.exe
            artifacts/*-portable.zip
            artifacts/*.msix
            artifacts/SHA256SUMS.txt
